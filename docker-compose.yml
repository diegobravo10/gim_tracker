services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gym}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gym}
      POSTGRES_DB: ${POSTGRES_DB:-gym}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - gym_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-gym} -d ${POSTGRES_DB:-gym}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gym_db_data:
